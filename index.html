<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<meta name="description" content="Tfarraj Live TV — live channels">
<title>Tfarraj · Live Channels</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tfarraj">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/channels.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <div class="logo">T</div>
      <h1>Live Channels</h1>
    </header>

    <div class="channel-grid" id="channel-grid"></div>
  </div>

<script>
  // Render channel cards grouped by country from the shared CHANNELS data.
  (function () {
    var grid = document.getElementById("channel-grid");
    var channels = window.CHANNELS || [];
    if (!channels.length) {
      grid.innerHTML = '<p style="color:#8fa5c7">No channels available.</p>';
      return;
    }

    // Group channels by country (extracted from description field "Country - lang")
    var byCountry = {};
    channels.forEach(function (c) {
      var country = "Other";
      if (c.description) {
        var parts = c.description.split(" - ");
        if (parts.length > 0) country = parts[0].trim();
      }
      if (!byCountry[country]) byCountry[country] = [];
      byCountry[country].push(c);
    });

    // Sort countries alphabetically
    var sortedCountries = Object.keys(byCountry).sort();

    sortedCountries.forEach(function (country) {
      var countryChannels = byCountry[country];
      var section = document.createElement("div");
      section.className = "country-section";

      var header = document.createElement("div");
      header.className = "country-header";
      header.innerHTML =
        '<h2>' + country + '</h2>' +
        '<span class="count">' + countryChannels.length + ' channel' + (countryChannels.length > 1 ? 's' : '') + '</span>';
      section.appendChild(header);

      var countryGrid = document.createElement("div");
      countryGrid.className = "channel-grid";
      countryChannels.forEach(function (c) {
        var card = document.createElement("a");
        card.className = "channel-card";
        card.href = "/channel/" + encodeURIComponent(c.id) + "/";
        card.setAttribute("aria-label", "Watch " + c.name);

        card.innerHTML =
          '<div class="channel-thumb">' +
            '<span class="badge"><span class="dot"></span> LIVE</span>' +
            c.name +
          "</div>" +
          '<div class="channel-info">' +
            "<h2>" + c.name + "</h2>" +
            "<p>" + (c.description || "Live stream") + "</p>" +
          "</div>" +
          '<span class="channel-cta">Watch Live →</span>';

        countryGrid.appendChild(card);
      });
      section.appendChild(countryGrid);
      grid.appendChild(section);
    });
  })();
</script>

<script>
  // Register the service worker for PWA installability + app-shell caching.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function (err) {
        console.error("SW registration failed:", err);
      });
    });
  }
</script>
</body>
</html>
