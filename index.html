<!DOCTYPE html>
<html lang="en">
<head>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(900px 500px at 50% -10%, rgba(22,119,255,.20), transparent 60%),
                radial-gradient(700px 400px at 85% 110%, rgba(34,211,238,.10), transparent 60%),
                linear-gradient(180deg, #050816 0%, #070d22 45%, #050816 100%);
    color: #eef2ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .card {
    width: 100%; max-width: 900px;
    background: rgba(18,32,68,.55);
    border: 1px solid rgba(120,170,245,.3);
    border-radius: 20px;
    padding: 22px;
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 10px 34px rgba(2,10,28,.55), 0 0 60px rgba(22,119,255,.18);
  }
  .brand {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 16px;
  }
  .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .brand h1 span { color: #9be7ff; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: #ff7a8f; background: rgba(255,59,92,.15);
    border: 1px solid rgba(255,59,92,.4);
    padding: 5px 12px; border-radius: 999px;
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ff3b5c;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,59,92,.6);} 50%{ box-shadow:0 0 0 7px rgba(255,59,92,0);} }

  .player {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: #000; border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(94,138,210,.25);
  }
  .player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

  .ovl {
    position: absolute; inset: 0; z-index: 2; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 24px; color: #c8d6f0;
    background: radial-gradient(80% 80% at 50% 40%, rgba(8,18,38,.55), rgba(3,6,18,.92));
  }
  .ovl[hidden] { display: none; }
  .ovl .spin {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid rgba(92,200,255,.15); border-top-color: #5cc8ff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(359deg); } }
  .ovl.err { color: #ff8f9a; }
  .ovl .sub { font-size: 13px; color: #8fa5c7; }
  .ovl .big { font-size: 15px; font-weight: 700; color: #fff; }
  .ovl.err .big { color: #ff8f9a; }

  @media (max-width: 560px) {
    .brand { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <h1>LB2</h1>
    <span class="badge"><span class="dot"></span> LIVE</span>
  </div>

  <div class="player">
    <video id="vid" controls playsinline></video>

    <div class="ovl" id="ovl-loading" hidden>
      <div class="spin"></div>
      <div class="big">Connecting to live stream…</div>
    </div>

    <div class="ovl" id="ovl-tap" hidden>
      <div class="big">Tap to start playback</div>
      <div class="sub">Your browser requires a tap to play audio and video.</div>
    </div>

    <div class="ovl err" id="ovl-error" hidden>
      <div class="big">The channel is temporarily unavailable.</div>
      <div class="sub" id="err-sub">The live signal could not be loaded.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
  // Fresh signed LB2 master playlist URL (media host allows CORS *, no referer).
  var DEFAULT_URL = "https://games1.elahmad.store/tv13_www_elahmad._lb2/index.m3u8?token=bb3d31bf035a7b8f69ef3c60f8b0ae4bae3b3493-e499614c0607b68856827c930910850c-1788213122-1788211322";

  var vid = document.getElementById('vid');
  var errSub = document.getElementById('err-sub');
  var ovlLoading = document.getElementById('ovl-loading');
  var ovlTap = document.getElementById('ovl-tap');
  var ovlError = document.getElementById('ovl-error');
  var currentUrl = null;
  var hls = null;
  var userActivated = false;

  function overlays(show) {
    ovlLoading.hidden = show !== 'loading';
    ovlTap.hidden = show !== 'tap';
    ovlError.hidden = show !== 'error';
  }

  // Hide the loading overlay once real frames start flowing.
  vid.addEventListener('playing', function(){
    overlays(null);
  });
  vid.addEventListener('canplay', function(){
    if (!ovlError.hidden) return;
    overlays(null);
  });

  function play(url) {
    if (!url) { overlays('error'); errSub.textContent = 'No stream URL.'; return; }
    currentUrl = url;
    overlays('loading');

    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    vid.pause(); vid.removeAttribute('src'); try { vid.load(); } catch (e) {}

    function startPlay() {
      // Start muted so autoplay isn't blocked by the browser (muted autoplay is
      // allowed). The user can unmute via the player controls.
      vid.muted = true;
      var p = vid.play();
      if (p) p.then(function(){ userActivated = true; }).catch(function(){
        if (!userActivated) { overlays('tap'); }
      });
    }

    if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = url;
      vid.onloadedmetadata = function(){ overlays(null); };
      vid.onerror = function(){ overlays('error'); errSub.textContent = 'Stream failed / expired.'; };
      startPlay();
      return;
    }

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 8, maxBufferLength: 30, enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(vid);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){ startPlay(); });
      hls.on(Hls.Events.ERROR, function(evt, data) {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { hls.startLoad(); }
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); }
        else { overlays('error'); errSub.textContent = 'Stream failed / expired.'; }
      });
    } else {
      vid.src = url;
      vid.onloadedmetadata = function(){ overlays(null); };
      vid.onerror = function(){ overlays('error'); errSub.textContent = 'Stream failed / expired.'; };
      startPlay();
    }
  }

  // Tap overlay triggers playback within the user gesture (not a bypass).
  ovlTap.addEventListener('click', function(){
    if (!currentUrl) return;
    userActivated = true;
    overlays('loading');
    var p = vid.play();
    if (p) p.catch(function(){});
  });

  // Autoplay to start (will show tap overlay if blocked).
  play(DEFAULT_URL);
</script>

</html>
