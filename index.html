<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<meta name="description" content="LB2 Live TV — watch and refresh the stream.">
<title>LB2 · Live TV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(900px 500px at 50% -10%, rgba(22,119,255,.20), transparent 60%),
                radial-gradient(700px 400px at 85% 110%, rgba(34,211,238,.10), transparent 60%),
                linear-gradient(180deg, #050816 0%, #070d22 45%, #050816 100%);
    color: #eef2ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .card {
    width: 100%; max-width: 900px;
    background: rgba(18,32,68,.55);
    border: 1px solid rgba(120,170,245,.3);
    border-radius: 20px;
    padding: 22px;
    backdrop-filter: blur(18px) saturate(150%);
    -webkit-backdrop-filter: blur(18px) saturate(150%);
    box-shadow: 0 10px 34px rgba(2,10,28,.55), 0 0 60px rgba(22,119,255,.18);
  }
  .brand {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 16px;
  }
  .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .brand h1 span { color: #9be7ff; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: #ff7a8f; background: rgba(255,59,92,.15);
    border: 1px solid rgba(255,59,92,.4);
    padding: 5px 12px; border-radius: 999px;
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #ff3b5c;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,59,92,.6);} 50%{ box-shadow:0 0 0 7px rgba(255,59,92,0);} }

  .player {
    position: relative; width: 100%; aspect-ratio: 16/9;
    background: #000; border-radius: 14px; overflow: hidden;
    border: 1px solid rgba(94,138,210,.25);
  }
  .player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

  .ovl {
    position: absolute; inset: 0; z-index: 2; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 24px; color: #c8d6f0;
    background: radial-gradient(80% 80% at 50% 40%, rgba(8,18,38,.55), rgba(3,6,18,.92));
  }
  .ovl[hidden] { display: none; }
  .ovl .spin {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid rgba(92,200,255,.15); border-top-color: #5cc8ff;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(359deg); } }
  .ovl.err { color: #ff8f9a; }
  .ovl .sub { font-size: 13px; color: #8fa5c7; }
  .ovl .big { font-size: 15px; font-weight: 700; color: #fff; }
  .ovl.err .big { color: #ff8f9a; }

  .controls {
    display: flex; align-items: center; gap: 12px;
    margin-top: 16px; flex-wrap: wrap;
  }
  .urlbox {
    flex: 1; min-width: 180px;
    padding: 11px 14px;
    background: rgba(5,8,22,.6);
    border: 1px solid rgba(94,138,210,.25);
    border-radius: 999px;
    color: #9be7ff;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    outline: none;
  }
  .urlbox:focus { border-color: rgba(120,170,245,.5); }
  button {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 20px; border-radius: 999px; cursor: pointer;
    font-size: 14px; font-weight: 700; border: 1px solid transparent;
    transition: transform .16s, box-shadow .25s;
  }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .btn-main {
    background: linear-gradient(135deg, #1677ff, #38a0ff);
    color: #fff; box-shadow: 0 6px 20px rgba(22,119,255,.4);
  }
  .btn-main:hover:not(:disabled) { box-shadow: 0 8px 26px rgba(56,160,255,.55); }
  .btn-main .spin-sm {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    animation: spin .8s linear infinite; display: none;
  }
  .btn-main.loading .spin-sm { display: inline-block; }
  .btn-main.loading .ico { display: none; }
  .btn-main .ico { font-size: 18px; line-height: 1; }
  #btn-refresh {
    width: 46px; height: 46px; padding: 0;
    border-radius: 50%;
    justify-content: center;
    font-size: 20px;
  }

  .status { color: #8fa5c7; font-size: 12px; margin-left: auto; font-family: ui-monospace, Menlo, monospace; }
  .hint { color: #5c6f92; font-size: 11px; margin-top: 12px; line-height: 1.5; }
  .hint code { background: rgba(255,255,255,.06); padding: 1px 6px; border-radius: 5px; color: #9be7ff; font-family: ui-monospace, Menlo, monospace; }

  @media (max-width: 560px) {
    .brand { flex-direction: column; align-items: flex-start; }
    .status { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <h1>LB2 <span>Live</span></h1>
    <span class="badge"><span class="dot"></span> LIVE</span>
  </div>

  <div class="player">
    <video id="vid" controls playsinline></video>

    <div class="ovl" id="ovl-loading" hidden>
      <div class="spin"></div>
      <div class="big">Connecting to live stream…</div>
    </div>

    <div class="ovl" id="ovl-tap" hidden>
      <div class="big">Tap to start playback</div>
      <div class="sub">Your browser requires a tap to play audio and video.</div>
    </div>

    <div class="ovl err" id="ovl-error" hidden>
      <div class="big">The channel is temporarily unavailable.</div>
      <div class="sub" id="err-sub">The live signal could not be loaded.</div>
    </div>
  </div>

  <div class="controls">
    <input class="urlbox" id="url-box" type="text" readonly spellcheck="false" aria-label="Stream URL + token" />
    <button class="btn-main" id="btn-refresh" aria-label="Refresh · Regenerate Token" title="Refresh · Regenerate Token"><span class="spin-sm"></span><span class="ico">🗘</span></button>
    <div class="status" id="status">Ready</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
  // Fresh signed LB2 master playlist URL (media host allows CORS *, no referer).
  var DEFAULT_URL = "https://games1.elahmad.store/tv13_www_elahmad._lb2/index.m3u8?token=e5b81a172bbf095bb0b681ff495db96bc1da09f3-3f367b5448839109c998e86a8fcbcac2-1788208878-1788207078";

  var vid = document.getElementById('vid');
  var btn = document.getElementById('btn-refresh');
  var statusEl = document.getElementById('status');
  var errSub = document.getElementById('err-sub');
  var ovlLoading = document.getElementById('ovl-loading');
  var ovlTap = document.getElementById('ovl-tap');
  var ovlError = document.getElementById('ovl-error');
  var urlBox = document.getElementById('url-box');
  var currentUrl = null;
  var hls = null;
  var userActivated = false;

  function overlays(show) {
    ovlLoading.hidden = show !== 'loading';
    ovlTap.hidden = show !== 'tap';
    ovlError.hidden = show !== 'error';
  }

  // Hide the loading overlay once real frames start flowing.
  vid.addEventListener('playing', function(){
    overlays(null);
    statusEl.textContent = '● Live';
  });
  vid.addEventListener('canplay', function(){
    if (!ovlError.hidden) return;
    overlays(null);
  });

  function play(url) {
    if (!url) { overlays('error'); errSub.textContent = 'No stream URL.'; return; }
    currentUrl = url;
    urlBox.value = url;
    overlays('loading');
    statusEl.textContent = 'Connecting…';

    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    vid.pause(); vid.removeAttribute('src'); try { vid.load(); } catch (e) {}

    function startPlay() {
      // Start muted so autoplay isn't blocked by the browser (muted autoplay is
      // allowed). The user can unmute via the player controls.
      vid.muted = true;
      var p = vid.play();
      if (p) p.then(function(){ userActivated = true; }).catch(function(){
        if (!userActivated) { overlays('tap'); }
      });
    }

    if (vid.canPlayType('application/vnd.apple.mpegurl')) {
      vid.src = url;
      vid.onloadedmetadata = function(){ overlays(null); statusEl.textContent = '● Live'; };
      vid.onerror = function(){ overlays('error'); errSub.textContent = 'Stream failed / expired.'; statusEl.textContent = 'Offline'; };
      startPlay();
      return;
    }

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 8, maxBufferLength: 30, enableWorker: true });
      hls.loadSource(url);
      hls.attachMedia(vid);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){ startPlay(); });
      hls.on(Hls.Events.ERROR, function(evt, data) {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) { statusEl.textContent = 'Reconnecting…'; hls.startLoad(); }
        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); statusEl.textContent = 'Recovering…'; }
        else { overlays('error'); errSub.textContent = 'Stream failed / expired.'; statusEl.textContent = 'Offline'; }
      });
    } else {
      vid.src = url;
      vid.onloadedmetadata = function(){ overlays(null); statusEl.textContent = '● Live'; };
      vid.onerror = function(){ overlays('error'); errSub.textContent = 'Stream failed / expired.'; statusEl.textContent = 'Offline'; };
      startPlay();
    }
  }

  // Tap overlay triggers playback within the user gesture (not a bypass).
  ovlTap.addEventListener('click', function(){
    if (!currentUrl) return;
    userActivated = true;
    overlays('loading');
    statusEl.textContent = '● Live';
    var p = vid.play();
    if (p) p.catch(function(){});
  });

  function isPlayableM3u8(url) {
    return fetch(url, { method: 'GET' }).then(function(res){
      if (!res.ok) return false;
      return res.text().then(function(t){ return t.trim().indexOf('#EXTM3U') === 0; });
    }).catch(function(){ return false; });
  }

  // Refresh / regenerate token.
  btn.addEventListener('click', async function(){
    btn.disabled = true; btn.classList.add('loading');
    statusEl.textContent = 'Regenerating token…';
    // Only trust a freshly minted URL once it is verified to actually play.
    var urlToUse = DEFAULT_URL;
    try {
      var res = await fetch('/api/token');
      var ok = res.ok;
      var data = ok ? await res.json() : null;
      if (ok && data && data.url && await isPlayableM3u8(data.url)) {
        urlToUse = data.url;
        statusEl.textContent = 'Token renewed · ● Live';
      } else {
        statusEl.textContent = 'Fresh token rejected · using verified stream';
      }
    } catch (e) {
      statusEl.textContent = 'Token service busy · using verified stream';
    }
    play(urlToUse);
    btn.disabled = false; btn.classList.remove('loading');
  });

  // Autoplay to start (will show tap overlay if blocked).
  play(DEFAULT_URL);
</script>
</body>
</html>
