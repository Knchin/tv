<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050816">
  <meta name="description" content="Tfarraj — browse live TV channels by country and watch instantly">
  <title>Tfarraj · Live TV</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tfarraj">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/globe.css">
  <script src="/assets/channels.js" defer></script>
  <script src="/assets/data/channels.js" defer></script>
</head>
<body>

  <!-- Player / browse area fills the full viewport -->
  <div id="globe-canvas" class="globe-canvas"></div>

  <!-- Floating header -->
  <header class="globe-header">
    <div class="globe-header-left">
      <a href="/" class="logo" aria-label="Tfarraj home" title="Tfarraj home">T</a>
      <h1 class="globe-title">Live Channels</h1>
    </div>
    <div class="globe-header-center">
      <div class="globe-search">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="search" id="globe-search-input" class="globe-search-input"
               placeholder="Search channels or countries…" autocomplete="off" spellcheck="false"
               aria-label="Search channels or countries">
        <button type="button" id="globe-search-clear" class="globe-search-clear" aria-label="Clear search" hidden>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
    <div class="globe-header-right">
      <a href="/channels/" class="globe-btn" aria-label="All channels" title="Browse all channels">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span class="globe-btn-label">Channels</span>
      </a>
      <button type="button" id="countries-panel" class="globe-btn" aria-label="Browse countries" title="Browse countries">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span class="globe-btn-label">Countries</span>
      </button>
    </div>
  </header>

  <!-- Country list sidebar (left, toggled by the Countries button) -->
  <aside id="globe-countries-list" class="globe-countries-list">
    <div class="countries-list-header">
      <h2>World</h2>
      <button type="button" id="countries-list-close" class="globe-btn-icon" aria-label="Close countries list">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div id="globe-countries-list-body" class="countries-list-body"></div>
  </aside>

  <!-- Channel panel (right side, opens when a country is selected) -->
  <aside id="globe-panel" class="globe-panel">
    <div class="globe-panel-header">
      <div class="globe-panel-title-row">
        <h2 id="globe-panel-title" class="globe-panel-title">Country</h2>
        <button type="button" id="panel-close" class="globe-btn-icon" aria-label="Close panel">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div id="globe-panel-count" class="globe-panel-count">0 channels</div>
      <input type="search" id="globe-panel-search" class="globe-panel-search"
             placeholder="Search channels…" autocomplete="off" spellcheck="false"
             aria-label="Search channels in this country">
    </div>
    <div id="globe-panel-body" class="globe-panel-body"></div>
  </aside>

  <!-- HLS playback support (same CDN/version as channel pages) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

  <script src="/assets/player.js"></script>
  <script src="/assets/browse.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (err) {
          console.error("SW registration failed:", err);
        });
      });
    }

    function bootBrowse() {
      if (!window.ChannelData || !window.ChannelData.channels) return;
      if (window.TfarrajBrowse) {
        window.TfarrajBrowse.init();
      } else {
        document.getElementById("globe-canvas").innerHTML =
          '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ff8f9a;font-size:14px;padding:24px;text-align:center">'
          + 'Could not initialize the browser. ' + '<a href="/channels/" style="color:#9be7ff">Go to all channels</a>.'
          + '</div>';
      }
    }

    // Start
    if (window.ChannelData && window.ChannelData.channels) {
      bootBrowse();
    } else {
      window.addEventListener("channeldata:ready", bootBrowse);
    }
  </script>

</body>
</html>
