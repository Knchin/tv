<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<meta name="description" content="LB2 Live Stream — Tfarraj Live TV">
<title>LB2 · Live Stream</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tfarraj">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/channels.js"></script>
<script>
  // Configure which channel this page plays before the shared player loads.
  window.ACTIVE_CHANNEL = window.findChannel("lb2");
</script>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <a class="back" href="/">← Back to channels</a>
      <h1><span id="channel-name">LB2</span> <span style="color:#ff3b5c">🔴</span></h1>
    </header>

    <div class="player">
      <video id="vid" controls playsinline></video>

      <div class="ovl" id="ovl-loading" hidden>
        <div class="spin"></div>
        <div class="big">Connecting to live stream…</div>
      </div>

      <div class="ovl" id="ovl-tap" hidden>
        <div class="big">Tap to start playback</div>
        <div class="sub">Your browser requires a tap to play audio and video.</div>
      </div>

      <div class="ovl err" id="ovl-error" hidden>
        <div class="big">The channel is temporarily unavailable.</div>
        <div class="sub" id="err-sub">The live signal could not be loaded.</div>
      </div>
    </div>

    <div class="player-actions">
      <button class="btn-refresh" id="btn-refresh" aria-label="Refresh stream token" title="Refresh stream token"><span class="ico">🗘</span><span class="spin-sm"></span></button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="/assets/player.js"></script>

<script>
  // Set the header channel name from config.
  var ac = window.ACTIVE_CHANNEL;
  if (ac) document.getElementById("channel-name").textContent = ac.name;

  // Register the service worker for PWA installability + app-shell caching.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function (err) {
        console.error("SW registration failed:", err);
      });
    });
  }
</script>
</body>
</html>
