<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tfarraj">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/channels.js"></script>
  <script>
    window.ACTIVE_CHANNEL = {
      id: "glNPCf2RbwoWmt",
      name: "zenith",
      slug: "zenith",
      country: "France",
      countryCode: "fr",
      category: "general",
      type: "hls",
      url: "https://live.azenagroup.com/zenith/index.ll.m3u8",
      languages: ["eng", "fra"],
      isGeoBlocked: false
    };
  </script>
</head>
<body>
  <div class="wrap">
    <header class="app-header">
      <a class="back" href="/">← Back to channels</a>
      <h1><span id="channel-name">zenith</span> <span style="color:#ff3b5c">🔴</span></h1>
    </header>
    <div class="player">
      <video id="vid" controls playsinline></video>
      <div class="ovl" id="ovl-loading" hidden><div class="spin"></div><div class="big">Connecting to live stream…</div></div>
      <div class="ovl" id="ovl-tap" hidden><div class="big">Tap to start playback</div><div class="sub">Your browser requires a tap to play audio and video.</div></div>
      <div class="ovl err" id="ovl-error" hidden><div class="big">The channel is temporarily unavailable.</div><div class="sub" id="err-sub">The live signal could not be loaded.</div></div>
    </div>
    <div class="player-actions">
      <button class="btn-refresh" id="btn-refresh" aria-label="Refresh stream token" title="Refresh stream token"><span class="ico">🗘</span><span class="spin-sm"></span></button>
      <button class="btn-fullscreen" id="btn-fullscreen" aria-label="Fullscreen"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>
      <button class="btn-cast" id="btn-cast" aria-label="Cast to device" title="Cast to TV or monitor"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"></path><line x1="2" y1="20" x2="2.01" y2="20"></line></svg></button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script src="/assets/player.js"></script>
  <script>
    var ac = window.ACTIVE_CHANNEL; if (ac) document.getElementById("channel-name").textContent = ac.name;
    if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function (err) { console.error("SW registration failed:", err); }); }); }
    document.getElementById("btn-fullscreen").addEventListener("click", function() { var player = document.querySelector(".player"); if (player.requestFullscreen) player.requestFullscreen(); else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen(); else if (player.msRequestFullscreen) player.msRequestFullscreen(); });
    var castBtn = document.getElementById("btn-cast"); if (castBtn) { castBtn.addEventListener("click", function () { var video = document.getElementById("vid"); if (video && video.remote && video.remote.prompt) { video.remote.prompt().catch(function (err) { console.error("Cast error:", err); }); } else { alert("Casting is not supported by this browser/device."); } }); }
    document.addEventListener("keydown", function(e) { if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return; var video = document.getElementById("vid"); if (!video) return; switch(e.key) { case " ": e.preventDefault(); if (video.paused) video.play(); else video.pause(); break; case "ArrowLeft": e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); break; case "ArrowRight": e.preventDefault(); video.currentTime = Math.min(video.duration, video.currentTime + 10); break; case "ArrowUp": e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); break; case "ArrowDown": e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); break; case "m": video.muted = !video.muted; break; case "f": var player = document.querySelector(".player"); if (player.requestFullscreen) player.requestFullscreen(); break; } });
  </script>
</body>
</html>
