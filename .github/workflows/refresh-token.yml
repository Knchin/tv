name: Auto-refresh LB2 token

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: "token-refresh"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Mint & update embedded token
        run: node scripts/mint-token.mjs

      - name: Regenerate channel pages
        run: python3 scripts/build.py

      - name: Commit fresh token if changed
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/channels.js assets/channels_canonical.json channel/
            git commit -m "chore: refresh LB2 stream token (auto)"
            git push
            echo "Pushed refreshed token."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No token change; nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # GITHUB_TOKEN pushes don't trigger the on:push deploy workflow, so call
  # the deploy workflow directly after a token refresh commit.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
