name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler@3.114.17

      - name: Prepare static assets
        run: |
          mkdir -p dist
          cp index.html player.html dist/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -e
          wrangler --version
          wrangler pages project list --account-id="$CLOUDFLARE_ACCOUNT_ID" \
            >/dev/null 2>&1 && echo "Project exists" || echo "Project does not exist yet"
          wrangler pages deploy dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --account-id="$CLOUDFLARE_ACCOUNT_ID" \
            --branch=main \
            --commit-dirty=true
