<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">
<title>Live Player · NOVA TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .cardx { width:100%; max-width:880px; background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-xl); padding:24px; backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%); box-shadow:var(--shadow-card); }
  .head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:18px; color:var(--text); }
  .state { font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
  .state.on { color:var(--success); font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .state.on .dot { width:8px; height:8px; border-radius:50%; background:var(--success); animation:livePulse 1.6s infinite; }
  .state.off { color:var(--danger); }

  .player { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); }
  .player video { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  .ovl { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-muted); text-align:center; padding:20px; font-size:14px; z-index:2; background:radial-gradient(80% 80% at 50% 40%, rgba(8,18,38,.55), rgba(3,6,18,.9)); }
  .ovl .spin { width:32px; height:32px; border:3px solid rgba(92,200,255,.15); border-top-color:var(--accent); border-radius:50%; animation:spin .9s linear infinite; }
  .ovl.err { color:var(--danger); }

  .url-row { display:flex; gap:10px; margin-top:16px; }
  .url-row input { flex:1; min-width:0; background:var(--glass); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:var(--font-mono); font-size:13px; padding:10px 12px; outline:none; }
  .url-row input:focus { border-color:var(--border-strong); }

  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .hint { font-size:12px; color:var(--text-muted); line-height:1.6; margin-top:14px; }
  .hint b { color:var(--accent-2); font-weight:600; }
  code { font-family:var(--font-mono); background:var(--surface-solid); padding:1px 6px; border-radius:5px; font-size:12px; color:var(--accent-2); }
  .spin.sm { width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:#fff; display:inline-block; vertical-align:middle; animation:spin .8s linear infinite; }

  @media(max-width:560px){ .head { flex-direction:column; align-items:flex-start; } .btns { width:100%; } .btns .btn { flex:1; justify-content:center; } }
</style>
</head>
<body>
<div class="app-bg" aria-hidden="true"></div>
<div class="cardx rise">
  <div class="head">
    <div class="brand"><span class="live-badge"><span class="dot"></span></span> LB2 · LBC Live</div>
    <div class="state off" id="state">OFFLINE</div>
  </div>

  <div class="player">
    <video id="vid" controls playsinline></video>
    <div class="ovl" id="ovl"><div class="spin"></div><span>Connecting&hellip;</span></div>
  </div>

  <div class="url-row">
    <input id="url" type="text" spellcheck="false" placeholder="Paste .m3u8 URL here (or generate a token)&hellip;" />
  </div>

  <div class="btns">
    <button class="btn btn-primary" id="gen"><span data-spin></span> Generate Token</button>
    <button class="btn btn-ghost" id="play">Play</button>
  </div>

  <div class="hint" id="hint">
    <b>Generate Token</b> fetches a fresh LB2 stream URL via the bundled Cloudflare Pages
    <code>/api/token</code> function and plays it automatically. Tokens expire ~30 min &mdash;
    regenerate as needed. You can also paste a URL manually and press <b>Play</b>.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
  var API = "/api/token";
  var vid = document.getElementById('vid');
  var urlInput = document.getElementById('url');
  var genBtn = document.getElementById('gen');
  var playBtn = document.getElementById('play');
  var ovl = document.getElementById('ovl');
  var state = document.getElementById('state');
  var hint = document.getElementById('hint');
  var hls = null;

  function setState(on){ state.className = 'state ' + (on ? 'on' : 'off'); state.innerHTML = on ? '<span class="dot"></span>LIVE' : 'OFFLINE'; }
  function ovlMode(kind){
    if(kind==='load'){ ovl.style.display='flex'; ovl.className='ovl'; ovl.innerHTML='<div class="spin"></div><span>Connecting&hellip;</span>'; }
    else if(kind==='err'){ ovl.style.display='flex'; ovl.className='ovl err'; ovl.innerHTML='<span>&#9888; Stream failed / token expired.</span><span style="font-size:12px">Generate a new token and retry.</span>'; }
    else { ovl.style.display='none'; }
  }
  function destroy(){ if(hls){ try{hls.destroy();}catch(e){} hls=null; } vid.pause(); vid.removeAttribute('src'); try{vid.load();}catch(e){} }

  function play(url){
    if(!url) return;
    destroy(); ovlMode('load'); setState(false);
    if(vid.canPlayType('application/vnd.apple.mpegurl')){
      vid.src = url;
      vid.addEventListener('loadedmetadata', function(){ ovlMode(); setState(true); });
      vid.addEventListener('error', function(){ ovlMode('err'); });
      vid.play();
    } else if (window.Hls && Hls.isSupported()){
      hls = new Hls({ liveSyncDurationCount:3, maxBufferLength:30 });
      hls.loadSource(url); hls.attachMedia(vid);
      hls.on(Hls.Events.MANIFEST_PARSED, function(){ ovlMode(); setState(true); vid.play(); });
      hls.on(Hls.Events.ERROR, function(evt,data){
        if(data.fatal){
          if(data.type===Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if(data.type===Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          else { destroy(); ovlMode('err'); }
        }
      });
    } else {
      vid.src=url;
      vid.addEventListener('loadedmetadata', function(){ ovlMode(); setState(true); });
      vid.addEventListener('error', function(){ ovlMode('err'); });
      vid.play();
    }
  }

  playBtn.addEventListener('click', function(){ play(urlInput.value.trim()); });
  urlInput.addEventListener('keydown', function(e){ if(e.key==='Enter') play(urlInput.value.trim()); });

  genBtn.addEventListener('click', async function(){
    genBtn.disabled = true; genBtn.classList.add('is-loading');
    try{
      hint.innerHTML = '<b>Generating fresh token&hellip;</b>';
      var res = await fetch(API);
      var data = await res.json();
      if(!data.url) throw new Error(data.error || 'No URL in response');
      urlInput.value = data.url;
      play(data.url);
      hint.innerHTML = '<b>Token generated.</b> Fresh URL loaded. Tokens expire ~30 min &mdash; regenerate as needed.';
    }catch(e){
      hint.innerHTML = '<b>' + e + '</b><br>Could not reach the token endpoint. Paste a fresh URL manually if needed.';
    }finally{
      genBtn.disabled=false; genBtn.classList.remove('is-loading');
    }
  });
</script>
</body>
</html>
